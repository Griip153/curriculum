<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Worked exercise — About me section</title>
  </head>
  <body>
    <!--
      Worked exercise (see LESSON.md): a self-contained "About me" section.
      Wrapped in <section> because it's a themed chunk of content with its own
      heading — not a <div>, which would carry no meaning at all.
    -->
    <section id="about">
      <h2>About me</h2>
      <p>I'm learning to build for the web, one project at a time.</p>
      <ul>
        <li>Based in Douala, Cameroon</li>
        <li>Currently: frontend track, week 1</li>
        <li>Interested in accessible, semantic HTML</li>
      </ul>
    </section>
  </body>
</html>
